# RAG 智能助手多服务编排 —— 权限后端 + 主服务 + 嵌入服务 + 重排服务
#
# 启动：docker compose up -d
# 停止：docker compose down
# 前提：先 docker build -t rag-assistant . 构建镜像
#
# 数据卷均指向 D 盘（遵守项目环境约定，不占用 C 盘）：
#   - HF 模型缓存：D:/VsCode/AI/.cache/huggingface（模型只下载一次，多服务共享）
#   - ChromaDB 向量库：宿主机 chroma_db/（主服务读写）
#
# 架构：
#   api-server (:8000)  ← 权限后端（JWT + SQLite），main 登录依赖
#   main (Streamlit :8501)
#     └─ mcp_server (stdio 子进程)
#          ├─ HTTP → embed-server (:8001)
#          └─ HTTP → rerank-server (:8002)

services:
  # ── 基础设施：Redis（检索缓存 + 限流令牌桶）──
  # 不纳入编排时主链路会「降级关闭」而非报错（缓存跳过、限流放行），
  # 容易被误以为已生效 —— 故默认启动。
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - D:/VsCode/AI/.cache/redis:/data    # 落 D 盘，遵守项目环境约定
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api-server:
    image: rag-assistant
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # ⚠️ 必须显式注入：config 默认 localhost:6379，容器内连不到 → 限流器单例
      # 初始化失败后会永久保持「降级放行」，直到进程重启
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 运行产物统一目录（权限数据库 → 持久化）
      RUNTIME_DATA_DIR: /app/runtime_data
    volumes:
      - ./runtime_data:/app/runtime_data     # 权限数据库（用户/角色/分组）落此目录
      # ⚠️ 必须挂载：/api/kb/documents 等接口要读 ChromaDB 与 db_meta.json。
      #    不挂则 api-server 读的是镜像内的空库 → 管理后台文档列表永远显示 0。
      - ./chroma_db:/app/chroma_db
      - ./uploaded_docs:/app/uploaded_docs   # 删除文档时同步清理原始文件
      - ./.env:/app/.env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  embed-server:
    image: rag-assistant
    command: python embed_server.py
    ports:
      - "8001:8001"
    volumes:
      - D:/VsCode/AI/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30   # 模型加载 420MB，冷启动需时间，重试次数给足
      start_period: 10s
    restart: unless-stopped

  rerank-server:
    image: rag-assistant
    command: python rerank_server.py
    ports:
      - "8002:8002"
    volumes:
      - D:/VsCode/AI/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30   # 重排模型 568MB，加载更慢
      start_period: 15s
    restart: unless-stopped

  main:
    image: rag-assistant
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      # 主服务不再本地加载模型，走独立模型服务
      EMBED_SERVER_URL: http://embed-server:8001
      RERANK_SERVER_URL: http://rerank-server:8002
      API_SERVER_URL: http://api-server:8000   # 登录走容器内权限后端，替换硬编码 localhost:8000
      # ⚠️ 必须显式注入：.env 里的 LANGFUSE_HOST=localhost:3000 在容器内指向容器自己，
      #    上报会全部失败（降级安全不崩，但 trace 全丢）。实测 host.docker.internal 可通。
      #    config.py 的 load_dotenv 不覆盖已有环境变量，故此处注入生效。
      LANGFUSE_HOST: http://host.docker.internal:3000
      # ⚠️ 必须显式注入：config 默认 localhost:6379，容器内连不到 → 限流器单例
      # 初始化失败后会永久保持「降级放行」，直到进程重启
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 运行产物统一目录（审计/Token/问答日志/告警/长期记忆库 → 持久化）
      RUNTIME_DATA_DIR: /app/runtime_data
    volumes:
      - D:/VsCode/AI/.cache/huggingface:/root/.cache/huggingface
      # PaddleOCR 模型缓存（首次 OCR 时下载，落 D 盘避免容器重建后重新下载）
      - D:/VsCode/AI/.cache/paddleocr:/root/.paddleocr
      # ChromaDB 向量库 + 上传文档 落宿主机（数据持久化）
      - ./chroma_db:/app/chroma_db
      - ./uploaded_docs:/app/uploaded_docs
      # 运行产物目录（统一挂「目录」而非单文件——单文件挂载在宿主机文件
      # 不存在时会被 Docker 建成同名目录，导致 SQLite 打开失败）
      - ./runtime_data:/app/runtime_data
      - ./.env:/app/.env
    depends_on:
      api-server:
        condition: service_healthy
      embed-server:
        condition: service_healthy
      rerank-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
